# Publishes the site to GitHub Pages on every push to main.
# The same file runs in both repositories (hasibullahshanto.com and mdhasibullah.com);
# each repository's custom domain is set in its Pages settings, not in a CNAME file.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Never stop a deploy halfway: a cancelled one can leave GitHub Pages locked for a while.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site (clean addresses, client pages, sitemap)
        run: node tools/build.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub Pages sometimes still holds the previous deploy for a minute or two ("in progress deployment").
      # Try again after a pause instead of failing.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 90
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 180
      - id: third
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}" >> "$GITHUB_OUTPUT"
