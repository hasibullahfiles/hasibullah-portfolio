# Publishes the site to GitHub Pages on every push to main.
# The same file runs in both repositories (hasibullahshanto.com and mdhasibullah.com);
# each repository's custom domain is set in its Pages settings, not in a CNAME file.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Never stop a deploy halfway: a cancelled one can leave GitHub Pages locked for a while.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site (clean addresses, client pages, sitemap)
        run: node tools/build.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
